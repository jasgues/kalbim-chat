name: Auto Commit 💝

on:
  schedule:
    # Türkiye saatiyle 16:30'dan itibaren 2 saatte bir (UTC+3 = UTC-3)
    # 16:30, 18:30, 20:30, 22:30, 00:30, 02:30, 04:30, 06:30, 08:30, 10:30, 12:30, 14:30 TR
    - cron: "30 13,15,17,19,21,23,1,3,5,7,9,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Set Git config
        run: |
          git config user.name "jasgues"
          git config user.email "webmanyak@gmail.com"

      - name: Pick random love message & commit
        run: |
          messages=(
            "Merveye aşığım 💖"
            "Merveyi seviyorum 🥰"
            "Mervem de mervem canım karım 👰"
            "Merveseksüelim 😍"
          )
          msg="${messages[$RANDOM % ${#messages[@]}]}"
          echo "Last auto commit: $(date)" >> autocommit_log.txt
          git add .
          git commit -m "$msg" || echo "No changes to commit"
          git push origin main
